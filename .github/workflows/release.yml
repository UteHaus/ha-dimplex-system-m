name: Release

# Runs when a version tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match "version" in the integration's manifest.json.
# Tags with a suffix (v0.2.0-beta.1) are published as pre-release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  INTEGRATION_DIR: ha-integration/custom_components/dimplex_uhi
  ZIP_NAME: dimplex_uhi.zip

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version "$INTEGRATION_DIR/manifest.json")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Ruff
        run: uvx ruff check --output-format=github .

      - name: Tests
        working-directory: ha-integration
        run: |
          uv venv
          uv pip install -r requirements_test.txt
          uv run --no-project pytest

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          cd "$INTEGRATION_DIR"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . -x "__pycache__/*" "*.pyc"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
